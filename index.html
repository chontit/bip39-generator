const enc=new TextEncoder();                                    // ตัวแปลงข้อความ -> ไบต์ UTF-8 (ใช้กับเต๋า/ไพ่)
const hx=b=>[...b].map(x=>x.toString(16).padStart(2,"0")).join(""); // ไบต์ -> สตริง hex สำหรับแสดงผล
const $=id=>document.getElementById(id);                        // ทางลัดเรียก element ตาม id
const val=id=>$(id).value;                                      // ทางลัดอ่านค่าจาก element
async function sha256(b){return new Uint8Array(await crypto.subtle.digest("SHA-256",b));} // SHA-256 (primitive เดียว)
const grp=(s,n)=>s.match(new RegExp(".{1,"+n+"}","g")).join(" ");// แทรกช่องว่างทุก n อักขระให้อ่านง่าย
const NEED={12:128,15:160,18:192,21:224,24:256};                // จำนวนบิต entropy ตามจำนวนคำ
const symNeeded=(t,words)=>Math.ceil(NEED[words]/Math.log2(t)); // จำนวนสัญลักษณ์ที่ต้องป้อนให้ครบ ENT บิต

/* ---- อ่าน input ตามชนิด -> หลัก (digits) + สตริงสะอาด ---- */
function parse(t,raw){
  raw=raw.toLowerCase();                                        // ทำพิมพ์เล็กให้สม่ำเสมอ
  if(t==2)  return {dig:[...raw].filter(c=>c=="0"||c=="1").map(Number), s:raw.replace(/[^01]/g,"")};            // เหรียญ: 0/1
  if(t==16) return {dig:[...raw].filter(c=>/[0-9a-f]/.test(c)).map(c=>parseInt(c,16)), s:raw.replace(/[^0-9a-f]/g,"")}; // HEX: ตัวละ 4 บิต
  if(t==6){ const d=[...raw].filter(c=>/[1-6]/.test(c)); return {dig:d.map(c=>(+c)%6), s:d.join("")}; }          // เต๋า6: หน้า 6 = เลข 0
  const m=raw.match(/([2-9tjqka])([cdhs])/g)||[],R="a23456789tjqk",S="cdhs";                                    // ไพ่: อันดับ+ดอก
  return {dig:m.map(c=>R.indexOf(c[0])*4+S.indexOf(c[1])), s:m.join("")};
}

/* ---- โหมด Real: รวม digits เป็นเลขฐานสองความกว้างคงที่ แล้วตัดบิตแรก ---- */
function realBits(dig,base,need){
  let v=0n,B=BigInt(base); for(const d of dig) v=v*B+BigInt(d);  // รวม digits เป็นจำนวนเต็มใหญ่ฐาน base
  const w=Math.ceil(dig.length*Math.log2(base));                // ความกว้างฟิลด์ตามทฤษฎี (บิต)
  const s=v.toString(2).padStart(w,"0");                        // เลขฐานสอง MSB-first เติม 0 หน้า
  return s.length<need?null:s.slice(0,need);                    // บิตไม่พอ -> null ; ไม่งั้นใช้บิตแรก
}

/* ---- แปลง input ของฐานยกกำลังสอง (เหรียญ/HEX) เป็น "RAW Byte" สำหรับ hash โดยตรง (ไม่ผ่าน UTF-8) ---- */
function inputToBytes(t,dig){
  let bits="";                                                  // สตริงบิตของ input
  if(t==2) for(const d of dig) bits+=d;                         // เหรียญ: 1 บิต/หลัก
  else     for(const d of dig) bits+=d.toString(2).padStart(4,"0"); // HEX: 4 บิต/หลัก
  if(bits.length%8) bits=bits.padEnd(bits.length+8-bits.length%8,"0"); // เติม 0 ให้ครบไบต์สุดท้าย
  const out=new Uint8Array(bits.length/8);                      // แปลงเป็นไบต์
  for(let i=0;i<out.length;i++) out[i]=parseInt(bits.slice(i*8,i*8+8),2);
  return out;
}

/* ---- แกน BIP39: ไบต์ entropy -> รายละเอียดทุกขั้น ---- */
async function bip39(ent){
  const h=await sha256(ent);                                    // checksum มาจาก SHA256(entropy) เสมอ
  const ENT=ent.length*8, CS=ENT/32;                            // ENT=บิต entropy, CS=บิต checksum
  let eb=""; for(const b of ent) eb+=b.toString(2).padStart(8,"0"); // entropy -> สตริงบิต
  let hb=""; for(const b of h)   hb+=b.toString(2).padStart(8,"0"); // SHA256(entropy) -> สตริงบิต
  const csb=hb.slice(0,CS), all=eb+csb;                          // checksum = บิตแรก CS ตัว ; รวม = words×11 บิต
  const g=[]; for(let i=0;i<all.length;i+=11){const bin=all.slice(i,i+11),dec=parseInt(bin,2);g.push({bin,dec,word:WL[dec]});} // 11บิต->ดัชนี->คำ
  return {hashHex:hx(h),ENT,CS,eb,csb,all,groups:g,mnemonic:g.map(x=>x.word).join(" ")};
}

/* ---- ระบายสีสตริงบิตรวม: เขียว=entropy ส้ม=checksum เว้นวรรคทุก 11 บิต ---- */
function colorBits(all,ENT){let o="";for(let i=0;i<all.length;i++){if(i&&i%11===0)o+=" ";o+=`<span class="${i<ENT?'bin':'cs'}">${all[i]}</span>`;}return o;}

/* ---- ตัวควบคุมหลัก: รวมขั้นตอน + แสดงทีละขั้น (เรียกอัตโนมัติทุกการเปลี่ยนแปลง) ---- */
async function gen(){

  const {dig,s}=parse(t,val("inp"));                            // แปลง input
  const typed=dig.length, real=typed*Math.log2(t);             // จำนวนที่ป้อน + เอนโทรปีจริง
  const tname={2:"โยนเหรียญ (ฐาน 2)",16:"HEX Dice (ฐาน 16)",6:"ลูกเต๋า 6 หน้า (ฐาน 6)",52:"ไพ่ (ฐาน 52)"}[t];

  const okStr=real>=need?'<span style="color:#5f5">ขนาดเพียงพอ ✓</span>':'<span class="err">ต่ำกว่าเกณฑ์ '+need+' บิต</span>';
  let html=`<div class="step"><b>ขั้นที่ 1 — ข้อมูลที่ได้จากการ "สุ่ม" (Entropy Source)</b>
    <div class="exp">เอนโทรปี (Entropy) คือ ความไม่แน่นอนเชิงข้อมูลอันเป็นรากฐานของกุญแจส่วนตัว (Private Key) การสร้าง Entropy ด้วยตนเองจากแหล่งสุ่มทางกายภาพ (เช่น การโยนเหรียญ, ทอยลูกเต๋า) คือการยึดหลัก Self-Sovereignty และ "Don't trust, verify" — นั่นหมายถึงเราไม่มอบความมั่นคงของกระเป๋าให้กับการสุ่มของอุปกรณ์หรือบุคคลที่สาม</div>
    ประเภท Entropy: ${tname} · ป้อนแล้ว ${typed} ครั้ง · Raw Entropy ${real.toFixed(1)} บิต (${okStr})<br>
    ข้อมูล Entropy: <code>${s}</code></div>`;

  // ----- ขั้น 2: เข้ารหัส Input เป็น entropy -----
  let ent;
  if(mode==="real"){                                            // ----- โหมด Real Entropy -----
    const bits=realBits(dig,t,need);
    let conv="";
    if(t==16) conv=`<div class="exp">แปลงเลขฐาน 16 (Hexadecimal) เป็นเลขฐาน 2 (Binary):</div><code>`+[...s].map(c=>c+"="+parseInt(c,16).toString(2).padStart(4,"0")).join("  ")+`</code><br>`; // HEX->Binary
    const fullbits=(()=>{let v=0n,B=BigInt(t);for(const d of dig)v=v*B+BigInt(d);return v.toString(2).padStart(Math.ceil(typed*Math.log2(t)),"0");})();
    html+=`<div class="step"><b>ขั้นที่ 2 — แสดงข้อมูลเป็นบิตสตรีม (Real Entropy)</b>
      <div class="exp">นำผลลัพธ์การสุ่มทุกครั้งมาแปลงเป็นเลขฐานสอง (โดยไม่ผ่านฟังก์ชันแฮช) ทุกบิตจึงเป็นเอนโทรปีดิบที่ตรวจสอบย้อนกลับได้ถึงต้นทาง</div>
      ${conv}บิตสตรีมเต็ม (${fullbits.length} บิต): <code>${t==16?grp(fullbits,4):grp(fullbits,8)}</code><br>
      <div class="exp" style="margin-top:6px">ใช้ข้อมูล ${need} บิตแรกมาเป็น Entropy สำหรับสร้าง Seedphrase ต่อไป</div>`;
    if(!bits){html+=`<span class="err">จำนวนบิตไม่พอ — ต้องการอีก ${symNeeded(t,words)-typed} ครั้ง (รวม ${symNeeded(t,words)})</span></div>`;O.innerHTML=html;MN="";return;}
    ent=new Uint8Array(need/8); for(let i=0;i<ent.length;i++) ent[i]=parseInt(bits.slice(i*8,i*8+8),2);
    html+=`</div>`;
  }else{                                                        // ----- โหมด Hash -----
    let bytes0,src;                                             // ไบต์ตั้งต้นที่จะนำไป hash + คำอธิบายแหล่งที่มา
    if(t==2||t==16){                                            // เหรียญ/HEX: hash "ไบต์ดิบ" โดยตรง (ไม่ผ่าน UTF-8)
      bytes0=inputToBytes(t,dig);
      src=`การโยนเหรียญ/HEX Dice เป็นประเภทข้อมูลเลขฐานสองอยู่แล้ว จึงสามารถใช้ <u>Raw Byte</u> นำไป Hash ได้โดยตรง (ไม่ผ่าน UTF-8)<br>ไบต์ที่นำไป Hash (hex): <code>${hx(bytes0)}</code>`;
    }else{                                                      // เต๋า6/ไพ่: ฐานไม่ลงตัวกับไบต์ จึง encode เป็น UTF-8 ก่อนรอบแรก
      bytes0=enc.encode(s);
      src=`ลูกเต๋า 6 หน้า/ไพ่ ไม่ใช่ข้อมูลประเภทเลขฐานสอง จึงต้องเข้ารหัส (Encode) ด้วย <u>UTF-8</u> ก่อน Hash รอบแรก<br>UTF-8 ที่นำไป hash: <code>"${s}"</code> (${bytes0.length} ไบต์)`;
    }
    let h=await sha256(bytes0), chain=`SHA-256( ${t==2||t==16?'Raw Byte':'UTF-8'} )`; // hash รอบแรก
    for(let i=1;i<+mode;i++){h=await sha256(h);chain=`SHA-256( ${chain} )`;}          // hash ซ้ำตามจำนวนรอบ
    ent=h.slice(0,need/8);                                      // ตัดไบต์แรกตามขนาด entropy
    html+=`<div class="step"><b>ขั้นที่ 2 — นำ Entropy ไปผ่านกระบวนการ SHA-256 ×${mode} Hash</b>
      <div class="exp">${src}<br>ผ่าน Hash Function จำนวน ${mode} รอบ เพื่อกระจายบิต (diffusion) อย่างสม่ำเสมอ (การ Hash ไม่ใช่การสุ่ม Entropy ดังนั้น ความมั่นคงที่แท้จริงถูกจำกัดด้วยเอนโทรปีต้นทางขนาด ${real.toFixed(1)} บิต เสมอ)</div>
      ${chain}<br>ผลลัพธ์การ Hash: <code>${hx(h)}</code><br><div class="exp">ใช้ข้อมูล ${need/8} ไบต์แรกเพื่อนำไปสร้าง Seedphrase ต่อไป</div></div>`;
    if(real<need) html+=`<div class="lead warn">⚠ เอนโทรปีต้นทางเพียง ${real.toFixed(1)} บิต — ผลที่ได้ดู "สุ่ม" แต่ความปลอดภัยจริงเท่ากับ ${real.toFixed(1)} บิตเท่านั้น</div>`;
  }

  const r=await bip39(ent);                                     // คำนวณ checksum + แตกคำ
  MN=r.mnemonic;                                                // เก็บไว้ให้ปุ่ม copy

  // ----- ขั้น 3: Entropy -----
  html+=`<div class="step"><b>ขั้นที่ 3 — Entropy (${r.ENT} บิต)</b>
    <div class="exp">ข้อมูลนี้คือเอนโทรปีขนาด ${r.ENT} บิตที่จะต้องนำมาใช้คำนวณเพื่อสร้าง Seedphrase สำหรับกระเป๋าบิตคอยน์ต่อไป</div>
    hex: <code>${hx(ent)}</code><br>bin: <code class="bin">${grp(r.eb,4)}</code></div>`;

  // ----- ขั้น 4: Checksum (ไฮไลต์ HEX ที่เป็นที่มาของ checksum + กางเป็น Binary) -----
  const nHex=Math.ceil(r.CS/4);                                 // จำนวน hex char ที่ครอบคลุม checksum
  const head=r.hashHex.slice(0,nHex), rest=r.hashHex.slice(nHex); // หัว hex ที่เกี่ยวข้อง + ที่เหลือ
  const headBin=[...head].map(c=>parseInt(c,16).toString(2).padStart(4,"0")).join(" "); // หัว hex -> binary
  html+=`<div class="step"><b>ขั้นที่ 4 — คำนวณ Checksum (${r.CS} บิต)</b>
    <div class="exp">การคำนวณ Checksum ตามมาตรฐาน BIP-39 = บิตแรก ENT/32 = ${r.ENT}/32 = ${r.CS} บิต ของ SHA-256(entropy) และนำไปต่อท้าย Entropy ในขั้นตอนที่ 3 เพื่อให้กระเป๋าตรวจจับการพิมพ์ Seedphrase ผิดได้ทันที (Error Detection) — เป็นกลไกเพื่อความถูกต้องของข้อมูล มิใช่กลไกความปลอดภัย</div>
    SHA-256(entropy): <code><span class="hi">${head}</span>${rest}</code>
    <div class="exp" style="margin-top:6px">นำ HEX ${nHex} ตัวแรกที่ไฮไลต์ (= ${nHex*4} บิต) เป็นแปลงเป็นเลขฐานสอง (เพื่อให้เห็นที่มาของตัวเลข Checksum):</div>
    HEX [<span class="hi">${head}</span>] = <code>${headBin}</code> → ดึง ${r.CS} บิตแรกมาใช้คำนวณ = <code class="cs">${r.csb}</code></div>`;

  // ----- ขั้น 5: รวมบิต + แบ่งชุดละ 11 บิต -----
  html+=`<div class="step"><b>ขั้นที่ 5 — รวมบิตแล้วแบ่งเป็นชุดละ 11 บิต</b>
    <div class="exp">รวม Entropy ${r.ENT} บิตเข้ากับ Checksum ${r.CS} บิต = ${r.all.length} บิต ซึ่งเท่ากับ ${words} × 11 พอดี จากนั้นแบ่งเป็นชุดละ 11 บิต และนำไปเทียบกับลำดับคำที่ 0 ถึง 2047 ในตารางคำมาตรฐาน (wordlist) (สังเกตว่าคำสุดท้ายคือจุดที่ Entropy ผสานเข้ากับ Checksum ที่คำนวณได้)
    <br><span class="bin">■ เขียว = entropy</span> · <span class="cs">■ ส้ม = checksum</span></div>
    <code>${colorBits(r.all,r.ENT)}</code>
    <table><tr><th>#</th><th>11 บิต</th><th>ดัชนี (ฐานสิบ)</th><th>คำ</th></tr>
    ${r.groups.map((x,i)=>`<tr><td>${i+1}</td><td class="bin">${x.bin}</td><td class="dec">${x.dec}</td><td class="w">${x.word}</td></tr>`).join("")}</table></div>`;

  // ----- ขั้น 6: Mnemonic + ปุ่ม copy -----
  html+=`<div class="step"><b>ขั้นที่ 6 — Seed Phrase (BIP-39 Mnemonic, ${words} คำ)</b>
    <div class="exp">แสดงผลลัพธ์ mnemonic ที่เราสามารถนำไปใช้งานกับ Hardware Wallet หรือ Software Wallet มาตรฐาน BIP39 โดยตรงได้ทั้งหมด (เช่น Sparrow หรือ Coldcard) เน้นย้ำให้ทำการบันทึกลงบนอุปกรณ์ออฟไลน์เท่านั้น (กระดาษ, แผ่นเหล็ก หรืออุปกรณ์จัดเก็บ Seedphrase ที่มีจำหน่ายตามท้องตลาด) ลำดับคำมีความสำคัญมาก ห้ามทำการถ่ายภาพหรือพิมพ์ในเครื่องพิมพ์ที่เชื่อมต่อกับอินเตอร์เน็ตโดยเด็ดขาด — Your keys, your coins.</div>
    <p class="mn">${r.mnemonic}</p>
    <button onclick="cp(this)">📋 คัดลอก (พร้อมวางใน Sparrow Wallet)</button></div>`;

  O.innerHTML=html;                                             // แสดงผลทั้งหมด
}

/* ---- คัดลอก mnemonic ลงคลิปบอร์ด (ใช้ execCommand เพื่อรองรับ file:// บน Tails) ---- */
function cp(btn){
  const ta=document.createElement("textarea"); ta.value=MN; document.body.appendChild(ta); ta.select(); // textarea ชั่วคราว
  try{document.execCommand("copy");}catch(e){} document.body.removeChild(ta);                            // คัดลอกแล้วลบทิ้ง
  const o=btn.textContent; btn.textContent="✓ คัดลอกแล้ว"; setTimeout(()=>btn.textContent=o,1200);      // แจ้งผล
}
/* ---- จำกัดอักขระ input ให้ตรงชนิด ---- */
function filt(){
  const re={2:/[^01]/g,16:/[^0-9a-fA-F]/g,6:/[^1-6]/g,52:/[^acdhjkqst2-9 \n]/gi}[+val("type")]; // อักขระต้องห้ามแต่ละชนิด
  $("inp").value=$("inp").value.replace(re,"");                // ลบตัวที่ไม่ตรงประเภท
}
/* ---- ตัวนับ entropy (เช่น 50/128) ปรับตามชนิด+จำนวนคำ ---- */
function counter(){
  const t=+val("type"),words=+val("words"),{dig}=parse(t,val("inp"));
  const need=symNeeded(t,words),have=dig.length;
  $("cnt").innerHTML=`เอนโทรปีที่ป้อน: <b>${have}/${need}</b> ครั้ง `+
    (have>=need?'<span style="color:#5f5">✓ ครบ</span>':`<span class="warn">— ขาดอีก ${need-have}</span>`)+
    ` · เป้าหมาย ${NEED[words]} บิต (${words} คำ)`;
}
/* ---- สุ่ม entropy จาก CSPRNG ของระบบให้ครบจำนวน ---- */
function rnd(){
  const t=+val("type"),words=+val("words"),n=symNeeded(t,words);
  const a=new Uint8Array(n); crypto.getRandomValues(a);         // เลขสุ่มเข้ารหัสจากระบบ
  const R="a23456789tjqk",S="cdhs"; let o="";
  for(let i=0;i<n;i++){const v=a[i];
    o += t==2?(v&1) : t==16?(v&15).toString(16) : t==6?((v%6)+1) : (R[((v%52)/4)|0]+S[(v%52)%4]+" ");}
  $("inp").value=o.trim(); update();
}
function clr(){$("inp").value="";update();}                     // ล้างช่อง entropy
function update(){filt();counter();gen();}                      // realtime: กรอง -> นับ -> คำนวณ

/* ---- ผูกเหตุการณ์: เปลี่ยน dropdown ใด ๆ ก็คำนวณใหม่ทันที ---- */
const HINTS={2:"พิมพ์ได้เฉพาะ 0 และ 1",16:"พิมพ์ได้เฉพาะ 0-9 และ A-F",6:"พิมพ์ได้เฉพาะ 1-6",52:"พิมพ์ไพ่ เช่น ah ks 7c (อันดับ a23456789tjqk + ดอก cdhs)"};
["type","words","mode"].forEach(id=>$(id).onchange=()=>{$("hint").textContent="— "+HINTS[val("type")];update();});
$("hint").textContent="— "+HINTS["2"]; counter(); gen();        // ตั้งค่าเริ่มต้น + คำนวณครั้งแรก

/* ---- SELF-TEST: ยืนยัน engine ด้วย test vector ทางการ 2 ชุด (เทียบสตริงเต็ม 12 คำ) ---- */
(async()=>{
  try{
    const a=await bip39(new Uint8Array(16));                    // เวกเตอร์ 1: entropy 16 ไบต์ "ศูนย์" (กระตุ้นบิต 0)
    const b=await bip39(new Uint8Array(16).fill(0xff));         // เวกเตอร์ 2: entropy 16 ไบต์ "0xff" (กระตุ้นบิต 1 ทุกตัว)
    const ok = a.mnemonic===("abandon ".repeat(11)+"about")     // ศูนย์ ต้องได้ abandon×11 + about (เทียบครบทั้ง 12 คำ)
            && b.mnemonic===("zoo ".repeat(11)+"wrong");        // 0xff ต้องได้ zoo×11 + wrong (ยืนยัน wordlist+checksum อีกด้าน)
    const st=$("st"); st.textContent=ok?"ระบบการคำนวณ: ✓ ตรง Test Vector BIP39 2 ชุด (ศูนย์→abandon…about, 0xff→zoo…wrong)":"ระบบการคำนวณ: ✗ ผิดพลาด อย่าใช้"; st.className=ok?"ok":"bad"; // ผ่านทั้งคู่จึงเขียว
  }catch(e){const st=$("st");st.textContent="ระบบการคำนวณ: ✗ "+e.message;st.className="bad";} // engine พัง -> แดงพร้อมเหตุผล
})();
